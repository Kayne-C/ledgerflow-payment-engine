# Full topology on one machine:
#   docker compose up --build
#
#   API (REST, X-Api-Key) ──▶ SQL Server (events + read models + outbox, one transaction)
#   Processor ×2 ──▶ leases outbox rows ──▶ Kafka (24 partitions, keyed by source account)
#   Processor ×2 ◀── consumes saga commands ──▶ Risk engine (gRPC, Redis velocity) ──▶ SQL Server
#   Traces / metrics / logs ──▶ Aspire dashboard (http://localhost:18888)
#
# Oracle Database 23ai instead of SQL Server:
#   docker compose -f docker-compose.yml -f docker-compose.oracle.yml up --build

x-database: &database
  Database__Provider: SqlServer
  Database__ConnectionString: Server=sqlserver,1433;Database=LedgerFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LedgerFlow_Dev_2026!};TrustServerCertificate=True

x-kafka: &kafka
  Messaging__Transport: Kafka
  Messaging__Kafka__BootstrapServers: kafka:9092
  Messaging__Kafka__Partitions: "24"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LedgerFlow_Dev_2026!}
    ports: ["1433:1433"]
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: ledgerflow-kraft-cluster-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 30

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports: ["18888:18888"]

  # One-shot: EF Core migrations + demo accounts, then exits.
  migrator:
    build: { context: ., dockerfile: src/LedgerFlow.Api/Dockerfile }
    command: ["--migrate-only"]
    environment:
      <<: *database
      ASPNETCORE_ENVIRONMENT: Docker
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "true"
      Messaging__Outbox__Enabled: "false"
    depends_on:
      sqlserver: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: src/LedgerFlow.Api/Dockerfile }
    environment:
      <<: [*database, *kafka]
      ASPNETCORE_ENVIRONMENT: Docker
      OTEL_SERVICE_NAME: ledgerflow-api
      Kestrel__Endpoints__Http__Url: http://+:8080
      Messaging__Outbox__Enabled: "false" # processors relay the outbox
      Messaging__ConsumersEnabled: "false"
      # Development keys only (see README): lf_demo_merchant_7f3a9c2e5b / lf_demo_ops_4d8e1b6a0c
      ApiClients__Clients__0__ClientId: demo-merchant
      ApiClients__Clients__0__KeyHash: 2bd611a282fb1584b23e589bd9b88b3c997b3eb72b929249cb0cd63562ecabc4
      ApiClients__Clients__0__Scopes__0: payments
      ApiClients__Clients__1__ClientId: ops-console
      ApiClients__Clients__1__KeyHash: cc1267d74b934cb2294d0954c85d5290ba708f76c796204d29f63f1f3e5750bd
      ApiClients__Clients__1__Scopes__0: payments
      ApiClients__Clients__1__Scopes__1: admin
    ports: ["8090:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  processor:
    build: { context: ., dockerfile: src/LedgerFlow.Processor/Dockerfile }
    environment:
      <<: [*database, *kafka]
      DOTNET_ENVIRONMENT: Docker
      OTEL_SERVICE_NAME: ledgerflow-processor
      Messaging__ConsumersEnabled: "true"
      Messaging__Kafka__ConsumersPerProcess: "4"
      Messaging__Outbox__Enabled: "true"
      Messaging__Sweeper__Enabled: "true"
      Risk__Mode: Grpc
      Risk__Address: http://risk:8080
    depends_on:
      migrator: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      risk: { condition: service_started }
    deploy:
      replicas: 2

  risk:
    build: { context: ., dockerfile: src/LedgerFlow.Risk/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      OTEL_SERVICE_NAME: ledgerflow-risk
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      Kestrel__Endpoints__Grpc__Url: http://+:8080
      ConnectionStrings__Redis: redis:6379
    depends_on:
      redis: { condition: service_healthy }
